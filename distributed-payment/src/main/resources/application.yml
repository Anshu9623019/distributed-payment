## Devtools settings



server:
  port: 8081

spring:
  application:
    name: distributed-payment

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  # 1. Cloud Database (Neon Tech PostgreSQL Pooler Connection)
  datasource:
    url: jdbc:postgresql://ep-wild-darkness-anqwh4e3-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: ${DB_PASSWORD:npg_QzugL9DpdMl4}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # 2. Secure Cloud Memory Layer (Upstash Redis via Lettuce with SSL)
  data:
    redis:
      url: ${REDIS_URL:rediss://default:gQAAAAAAAm2TAAIgcDE3MTk3YWZjOTcwODA0ZGZmYTBiOTRjYWVjYWEyYWEzMQ@holy-teal-159123.upstash.io:6379}
      ssl:
        enabled: true
      connect-timeout: 10000ms
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # 3. Enterprise Event Streaming (Aiven Kafka Platform over TLS/SSL)
  kafka:
    bootstrap-servers: autocomplete-kafka-ak9623019-b363.g.aivencloud.com:19348
    properties:
      security.protocol: SSL
      ssl.truststore.location: classpath:certs/client.truststore.jks
      ssl.truststore.password: ${KAFKA_SSL_PASSWORD:AnshuSecret123}
      ssl.keystore.location: classpath:certs/client.keystore.jks
      ssl.keystore.password: ${KAFKA_SSL_PASSWORD:AnshuSecret123}
      ssl.key.password: ${KAFKA_SSL_PASSWORD:AnshuSecret123}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.add.type.headers: true
        spring.json.trusted.packages: "com.distributed_payment.*"
    listener:
      ack-mode: MANUAL_IMMEDIATE
      auto-startup: true

  task:
    scheduling:
      pool:
        size: 5

# 4. Security Framework Parameters
jwt:
  secret: ${JWT_SECRET:9a4f2c8d3e6b1a5c7d8e2f4a6b0c1d3e5f7a9b0c2d4e6f8a0b2c4d6e8f0a2c4d}
  expiration-ms: 86400000

# 5. Core Ledger Processing / Gateway Values
stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_your_secret_key_here}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}
  checkout:
    success-url: http://localhost:8081/api/v1/payments/success
    cancel-url: http://localhost:8081/api/v1/payments/cancel

# 6. Observability
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: OFF
    com.distributed_payment: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always